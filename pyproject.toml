[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "off-the-tape"
version = "0.1.0"
description = "Local historical evaluation for Agenthon Track 2 forecasts"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=18",
  "qfbench2-common>=2.3.1,<3",
  "qfbench2-track-forecasting==3.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
