[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "off-the-tape"
version = "0.1.0"
description = "Local historical evaluation for Agenthon Track 2 forecasts"
requires-python = ">=3.13"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
]

[project.optional-dependencies]
evaluation = ["qfbench2-common==2.3.1", "qfbench2-track-forecasting==3.1.0"]
test = ["pytest>=8"]

[project.scripts]
off-the-tape-backtest = "off_the_tape.cli:main"
forecast = "off_the_tape.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
